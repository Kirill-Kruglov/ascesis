[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"

[project]
name = "collapse-boundary"
version = "0.1.0"
description = "Toy rewrite-system collapse boundary experiment."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "numpy",
  "pandas",
  "scikit-learn",
  "matplotlib",
  "pytest",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
