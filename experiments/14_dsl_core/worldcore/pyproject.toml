[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"

[project]
name = "worldcore"
version = "0.1.0"
description = "Toy typed world-state DSL core for novelty and learnability experiments."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "networkx",
  "numpy",
  "pandas",
  "scikit-learn",
  "matplotlib",
  "tqdm",
  "pytest",
]

[project.optional-dependencies]
test = ["pytest"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
