[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"

[project]
name = "interpretive-closure-test"
version = "0.1.0"
description = "Experiment 17C: consequence invariance vs interpretive closure."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "pandas",
  "pytest",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
