[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"

[project]
name = "backbone-consequence"
version = "0.1.0"
description = "Experiment 17: global necessity / backbone stability for consequence equivalence."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "pandas",
  "matplotlib",
  "pytest",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
