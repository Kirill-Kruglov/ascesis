[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"

[project]
name = "semantic-perturbation-taxonomy"
version = "0.1.0"
description = "Experiment 17A.2: separate representation-preserving from theory-changing perturbations."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "pandas",
  "matplotlib",
  "pytest",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
