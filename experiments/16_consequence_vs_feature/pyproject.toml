[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"

[project]
name = "consequence-feature"
version = "0.1.0"
description = "Experiment 16: consequence-based equivalence vs shallow feature equivalence."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "pandas",
  "matplotlib",
  "pytest",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
